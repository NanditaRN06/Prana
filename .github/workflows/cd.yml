name: CD Pipeline
on:
  pull_request:
    branches: [ "main" ]

jobs:
  backend-gate:
    name: Backend Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Install Test Dependencies
        run: npm ci
        working-directory: tests

      - name: Run Backend Lint (Strict)
        run: npx eslint . --max-warnings 0
        working-directory: backend

      - name: Run Backend Unit Tests
        run: npm run test:be:unit
        working-directory: tests

      - name: Run Backend Integration Tests
        run: npm run test:be:integration
        working-directory: tests

      - name: Run Backend E2E Tests
        run: npm run test:be:e2e
        working-directory: tests

      - name: Run Backend System Tests
        run: npm run test:be:system
        working-directory: tests

      - name: Coverage Gate (Strict)
        run: npm run test:be:coverage -- --forceExit
        working-directory: tests

      - name: Upload Final Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-final
          path: tests/coverage/backend/

  frontend-gate:
    name: Frontend Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Test Dependencies
        run: npm ci
        working-directory: tests

      - name: Run Frontend Lint (Strict)
        run: npx eslint . --max-warnings 0
        working-directory: frontend

      - name: Run Frontend Unit Tests
        run: npm run test:fe:unit
        working-directory: tests

      - name: Run Frontend Integration Tests
        run: npm run test:fe:integration
        working-directory: tests

      - name: Production Build
        run: npm run build
        working-directory: frontend

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Backend Dependencies
        run: npm audit --audit-level=high || true
        working-directory: backend

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high || true
        working-directory: frontend

      - name: Audit Test Dependencies
        run: npm audit --audit-level=high || true
        working-directory: tests

      - name: Secret Scan
        uses: trufflesecurity/trufflehog-actions-scan@master
        with:
          args: --only-verified

  deployment-readiness:
    name: Deployment Readiness
    needs: [backend-gate, frontend-gate, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist-verify

      - name: Verify Build Artifact Exists
        run: |
          if [ -d "frontend-dist-verify" ] && [ "$(ls -A frontend-dist-verify)" ]; then
            echo "Artifact successfully verified."
          else
            echo "Build artifact missing!"
            exit 1
          fi

      - name: Validate Env Template
        run: |
          if [ -f "backend/.env.example" ]; then
            echo ".env.example exists."
          else
            echo "Missing backend/.env.example!"
            exit 1
          fi

      - name: Tag Preparation
        run: |
          echo "Ready for release tagging."